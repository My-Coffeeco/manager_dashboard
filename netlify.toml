# Netlify Deployment Configuration for My Coffee Co Dashboard

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  included_files = ["*.html", "*.css", "*.js", "*.woff2", "*.avif", "*.sql", "*.json", "client/dist/**"]

# Serverless function API routes
[[redirects]]
  from = "/admin/auth/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/admin/dashboard"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/admin/orders/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/admin/alerts/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/admin/stores"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/webhooks/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api"
  status = 200

# SPA fallback to React index.html
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
